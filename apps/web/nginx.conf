server { listen 8080; server_tokens off; root /usr/share/nginx/html; index index.html; location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; } location /api/ { proxy_pass http://api:4000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; } location / { try_files $uri $uri/ /index.html; } add_header X-Frame-Options DENY always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
