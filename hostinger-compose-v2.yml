name: traefik-pilot-v2

# Zero-configuration Hostinger Docker Manager deployment. It pulls public images,
# generates persistent secrets automatically, and opens the dashboard on port 8080.
services:
  bootstrap:
    image: alpine:3.21
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        make_secret() { od -An -N"$$1" -tx1 /dev/urandom | tr -d ' \n'; }
        [ -s /run/pilot-secrets/postgres_password ] || make_secret 24 > /run/pilot-secrets/postgres_password
        [ -s /run/pilot-secrets/jwt_secret ] || make_secret 48 > /run/pilot-secrets/jwt_secret
        [ -s /run/pilot-secrets/encryption_key ] || make_secret 32 > /run/pilot-secrets/encryption_key
        chmod 644 /run/pilot-secrets/*
    volumes:
      - pilot-secrets:/run/pilot-secrets
    networks: [pilot-internal]
    security_opt: [no-new-privileges:true]

  traefik:
    image: traefik:v3.7.1
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=pilot-edge
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --accesslog=true
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}

    volumes:
      - pilot-dynamic:/etc/traefik/dynamic
      - pilot-acme:/etc/traefik/acme
    depends_on:
      docker-socket-proxy:
        condition: service_started
    networks: [pilot-internal, pilot-edge]
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traefik_pilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD_FILE: /run/pilot-secrets/postgres_password
    volumes:
      - pilot-db:/var/lib/postgresql/data
      - pilot-secrets:/run/pilot-secrets:ro
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    networks: [pilot-internal]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      NETWORKS: 1
      PING: 1
      VERSION: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      EXEC: 0
      IMAGES: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SWARM: 0
      SYSTEM: 0
      VOLUMES: 0
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
    networks: [pilot-internal]
    tmpfs: [/run]
    security_opt: [no-new-privileges:true]

  api:
    image: ghcr.io/kawika4783/traefik-pilot-api:latest
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        POSTGRES_PASSWORD="$$(cat /run/pilot-secrets/postgres_password)"
        export DATABASE_URL="postgres://pilot:$${POSTGRES_PASSWORD}@db:5432/traefik_pilot"
        export JWT_SECRET="$$(cat /run/pilot-secrets/jwt_secret)"
        export ENCRYPTION_KEY="$$(cat /run/pilot-secrets/encryption_key)"
        exec node dist/index.js
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "false"
      ADMIN_ORIGIN: http://localhost:8080
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      TRAEFIK_API_URL: http://traefik:8080
      TRAEFIK_DYNAMIC_DIR: /data/traefik/dynamic
      BACKUP_DIR: /data/backups
      PORT: 4000
      HOSTING_PROVIDER: hostinger
      DEMO_MODE: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - pilot-dynamic:/data/traefik/dynamic
      - pilot-backups:/data/backups
      - pilot-secrets:/run/pilot-secrets:ro
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      docker-socket-proxy: {condition: service_started}
      traefik: {condition: service_healthy}
    networks: [pilot-internal]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/api/system/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  web:
    image: ghcr.io/kawika4783/traefik-pilot-web:latest
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    ports:
      - 8080:8080
    networks: [pilot-internal, pilot-edge]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]

networks:
  pilot-internal: {internal: true}
  pilot-edge: {name: pilot-edge}

volumes:
  pilot-db:
  pilot-dynamic:
  pilot-acme:
  pilot-backups:
  pilot-secrets:
